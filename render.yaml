services:
  - type: web
    name: royal-palace-chapel-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: api
    buildCommand: npm ci && npm run build && npm run prisma:deploy
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - api/**
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SCHEMA
        value: public
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: NEON_AUTH_BASE_URL
        sync: false
      - key: NEON_AUTH_JWKS_URL
        sync: false
      - key: NEON_AUTH_COOKIE_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
